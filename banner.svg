<svg width="1280" height="400" viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#FF9A76"/>
    </linearGradient>
    <linearGradient id="rp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D96FF"/>
      <stop offset="100%" stop-color="#3AD0C4"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#4D96FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#lp)"/>
  <rect x="640" width="640" height="400" fill="url(#rp)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <circle cx="170" cy="320" r="90" fill="#FFFFFF" opacity="0.18" filter="url(#soft)"/>
  <circle cx="1110" cy="90" r="90" fill="#FFFFFF" opacity="0.18" filter="url(#soft)"/>
  <!-- player 1 emblem -->
  <g transform="translate(250,200)">
    <circle cx="0" cy="0" r="70" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="-22" cy="-10" r="9" fill="#FF6B9D"/>
    <circle cx="22" cy="-10" r="9" fill="#FF6B9D"/>
    <path d="M-26 26 q26 26 52 0" stroke="#FF6B9D" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- player 2 emblem -->
  <g transform="translate(1030,200)">
    <circle cx="0" cy="0" r="70" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="-22" cy="-10" r="9" fill="#4D96FF"/>
    <circle cx="22" cy="-10" r="9" fill="#4D96FF"/>
    <path d="M-26 26 q26 26 52 0" stroke="#4D96FF" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>
  <!-- VS -->
  <g transform="translate(640,200)">
    <circle cx="0" cy="0" r="62" fill="#FFD166"/>
    <text x="0" y="22" font-family="'Baloo 2',sans-serif" font-size="56" font-weight="800" fill="#2A2A4A" text-anchor="middle">VS</text>
  </g>
  <text x="640" y="120" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="92" font-weight="800" fill="#FFFFFF" text-anchor="middle">同屏对决</text>
  <text x="640" y="320" font-family="'PingFang SC',sans-serif" font-size="30" fill="#FFFFFF" text-anchor="middle" opacity="0.95">一台手机 · 两个人 · 正面 PK ⚔️</text>
</svg>
